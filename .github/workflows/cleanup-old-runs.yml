name: Cleanup old workflow runs

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

concurrency:
  group: cleanup-old-workflow-runs
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Cancel queued/in-progress runs older than 2 hours
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

        run: |
          $cutoff = [DateTimeOffset]::UtcNow.AddHours(-2)

          Write-Host "Checking queued/in-progress runs created before $cutoff"

          $runs = gh run list `
            --repo $env:GH_REPO `
            --limit 500 `
            --json databaseId,status,createdAt,name |
            ConvertFrom-Json

          $runs |
          Where-Object {
              $_.status -in @("queued", "in_progress", "waiting", "pending") -and
              ([DateTimeOffset]::Parse($_.createdAt) -lt $cutoff)
          } |
          ForEach-Object {

              $run = $_

              # Re-check current status because it may have changed
              # since gh run list was executed.
              $current = gh run view $run.databaseId `
                --repo $env:GH_REPO `
                --json status |
                ConvertFrom-Json

              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Could not get current status for run $($run.databaseId)"
                  return
              }

              if ($current.status -notin @("queued", "in_progress", "waiting", "pending")) {
                  Write-Host "Skipping run $($run.databaseId): already $($current.status)"
                  return
              }

              Write-Host "Cancelling $($run.name) run $($run.databaseId) [$($current.status)] created $($run.createdAt)"

              # First try normal cancellation.
              gh run cancel $run.databaseId `
                --repo $env:GH_REPO

              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Cancellation requested successfully for run $($run.databaseId)"
                  return
              }

              # Status may have changed while cancellation was attempted.
              $afterCancel = gh run view $run.databaseId `
                --repo $env:GH_REPO `
                --json status |
                ConvertFrom-Json

              if ($LASTEXITCODE -eq 0 -and
                  $afterCancel.status -notin @("queued", "in_progress", "waiting", "pending")) {

                  Write-Host "Run $($run.databaseId) is now $($afterCancel.status); no force cancellation required."
                  return
              }

              Write-Warning "Normal cancellation failed for run $($run.databaseId); trying force cancellation."

              gh api `
                --method POST `
                "repos/$env:GH_REPO/actions/runs/$($run.databaseId)/force-cancel"


              if ($LASTEXITCODE -ne 0) {
                  Write-Warning "Force cancellation also failed for run $($run.databaseId)"
              }
              else {
                  Write-Host "Force cancellation requested successfully for run $($run.databaseId)"
              }
          }

          # A target workflow changing state while we inspect/cancel it
          # should not cause this maintenance workflow itself to fail.
          exit 0
