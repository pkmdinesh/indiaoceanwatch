name: Update coastal advisory status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Ignore the freshness gate and update immediately
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: coastal-status-update
  cancel-in-progress: true
  
jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Read official INCOIS sources
        shell: powershell
        run: |
          $minimumAgeHours = if ('${{ inputs.force }}' -eq 'true') { 0 } else { 0.20 }
          .\scripts\update-status.ps1 -Quiet -MinimumAgeHours $minimumAgeHours

      - name: Validate generated snapshot
        shell: powershell
        run: .\scripts\validate-status.ps1 -Path .\status.json

      - name: Generate Google TTS audio bulletins
        run: node scripts/generate-audio-bulletins.mjs

      - name: Commit updated snapshot
        id: commit_status
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json data/pfz-lines.geojson data/pfz-eez.geojson data/pfz-sectors.geojson data/pfz-landing-centres.geojson audio/bulletins/
          git diff --cached --quiet

          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update coastal advisory status & audio bulletins"

            git pull --rebase origin main
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to rebase onto latest main"
            }

            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push updated status"
            }

            "changed=true" >> $env:GITHUB_OUTPUT
          }
          else {
            "changed=false" >> $env:GITHUB_OUTPUT
          }

      - name: Deploy updated status to GitHub Pages
        if: steps.commit_status.outputs.changed == 'true'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-pages.yml --ref main
