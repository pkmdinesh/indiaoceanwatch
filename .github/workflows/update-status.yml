name: Update coastal advisory status

on:
  schedule:
    # Run away from the top of the hour because GitHub schedules are best-effort.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coastal-status-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read official INCOIS sources
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "schedule") {
            .\update-status.ps1 -Quiet -MinimumAgeHours 0.15
          } else {
            .\update-status.ps1 -Quiet
          }
      - name: Commit updated snapshot
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update coastal advisory status"
            git push
          }
