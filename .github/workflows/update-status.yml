name: Update coastal advisory status

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coastal-status-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read official INCOIS sources
        shell: powershell
        run: .\update-status.ps1 -Quiet

      - name: Commit updated snapshot
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update coastal advisory status"
            git push
          }
          else {
            Write-Host "No status.json changes to commit."
          }
